<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101310"><title>PrintCam · RUBBS3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101310;color:#f1f4ec;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:860px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #343933}header b{letter-spacing:-1px;font-size:23px}.mark{color:#c7ee70;margin-right:8px}small,.mono{font:11px ui-monospace,monospace;letter-spacing:.1em;color:#abb2a5}h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.065em;line-height:1;margin:10px 0 22px}figure{margin:0;position:relative;background:#191e1c;border-radius:20px;overflow:hidden;height:clamp(260px,44vh,440px);border:1px solid #3b413a}canvas,img{width:100%;height:100%;object-fit:contain}figure span{position:absolute;left:14px;top:14px;background:#101310e8;border:1px solid #485047;padding:7px 11px;border-radius:40px;color:#d5efad;font:12px ui-monospace,monospace}figcaption{display:flex;justify-content:space-between;margin:10px 3px 24px;color:#aab1a4;font-size:13px}.panel{border:1px solid #363e33;border-radius:18px;padding:20px;background:#1b201b}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:22px;letter-spacing:-.05em;margin:0 0 4px}button{cursor:pointer;border:0;font:inherit;color:inherit}#toggle{background:#c7ee70;color:#202719;font-weight:650;border-radius:30px;padding:12px 20px}button:disabled,input:disabled{opacity:.4}.levels{display:flex;align-items:center;gap:14px;margin-top:22px}input{width:100%;accent-color:#c7ee70}output{min-width:45px;font:14px ui-monospace,monospace}.presets{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.presets button{padding:8px 12px;background:#2c342a;border:1px solid #414b3c;border-radius:8px;font-size:13px}#notice{color:#f7c995}button:focus-visible,input:focus-visible{outline:3px solid white} [hidden]{display:none!important}
</style><header><b><i class="mark">◩</i>PrintCam</b><small>RUBBS3D</small></header><main><small>POSTAZIONE DI STAMPA</small><h1>A1 mini</h1><figure><img hidden id="feed" alt="Ripresa della stampante"><canvas hidden id="drawing" width="840" height="540" aria-label="Simulazione illustrata di una stampa in corso"></canvas><span id="status" role="status">Connessione…</span></figure><figcaption><span id="source">Fotocamera posteriore</span><span class="mono">CAM 01</span></figcaption><section class="panel"><div class="row"><div><h2>Illuminazione</h2><small>TORCIA IPHONE</small></div><button id="toggle" disabled>Accendi</button></div><div class="levels"><label for="power">Intensità</label><input id="power" type="range" min="0" max="100" value="0" disabled><output id="percent">0%</output></div><div class="presets"><button data-v="25" disabled>Luce tenue · 25%</button><button data-v="70" disabled>Primo strato · 70%</button></div></section><p role="status" id="notice"></p></main>
<script>
const el=id=>document.getElementById(id), demo=location.protocol==='file:'||location.search==='?demo', key=location.hash.slice(1);
const buttons=[el('toggle'),el('power'),...document.querySelectorAll('[data-v]')];
let level=0,lastLevel=50,busy=false,available=false,url,editing=false;
function render(){el('power').value=level;el('percent').textContent=level+'%';el('toggle').textContent=level?'Spegni':'Accendi';el('toggle').setAttribute('aria-pressed',String(level>0));buttons.forEach(b=>b.disabled=busy||!available);if(demo)draw()}
function draw(){const c=el('drawing').getContext('2d'),light=level/100,t=Date.now()/1200;
c.fillStyle='#192321';c.fillRect(0,0,840,540);
function poly(points,fill){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill()}
function line(x,y,X,Y,color,width){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
const g=c.createRadialGradient(420,304,12,420,280,430);g.addColorStop(0,'rgba(219,242,180,'+(.12+light*.52)+')');g.addColorStop(1,'#131a19');c.fillStyle=g;c.fillRect(0,0,840,540);
poly([[108,358],[422,228],[744,340],[428,494]],'#202923');poly([[108,348],[422,218],[744,330],[428,484]],'#485346');
for(let i=0;i<=10;i++){let f=i/10;line(108+314*f,348-130*f,428+316*f,484-154*f,'#687361',1);line(108+320*f,348+136*f,422+322*f,218+112*f,'#687361',1)}
line(651,298,651,57,'#9ca6a0',29);line(641,65,205,135,'#cad1c6',20);line(643,80,207,151,'#505b53',10);
for(let n=0;n<29;n++){let y=350-n*2; c.beginPath();c.ellipse(410,y,77+5*Math.sin(n/5),31,0,0,Math.PI*2);c.fillStyle=n===28?'#d0f38b':n%2?'#8fae59':'#aacb70';c.fill()}
let x=410+40*Math.sin(t);poly([[x-8,251],[x+8,251],[x,265]],'#e5c976');poly([[x-42,170],[x+34,170],[x+28,250],[x-30,250]],'#d6dcd2');line(x,121,x,170,'#858f87',16);c.fillStyle='#3b463c';c.beginPath();c.arc(x,209,23,0,2*Math.PI);c.fill();for(let j=0;j<5;j++)line(x-12,198+j*5,x+12,198+j*5,'#768173',2)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{Authorization:'Bearer '+key},cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error(r.status);return r}
async function setLight(v){if(busy)return;busy=true;render();try{if(demo)level=v;else{const s=await(await api('/light',{method:'POST',body:String(v)})).json();level=s.level;available=s.available}if(level)lastLevel=level;el('notice').textContent=''}catch{el('notice').textContent='Comando non confermato. Controlla la connessione e riprova.'}finally{busy=false;render()}}
el('toggle').onclick=()=>setLight(level?0:lastLevel);el('power').oninput=e=>{editing=true;el('percent').textContent=e.target.value+'%'};el('power').onchange=e=>{editing=false;setLight(+e.target.value)};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setLight(+b.dataset.v));
async function poll(){let wait=180;try{let blob=await(await api('/frame')).blob(),next=URL.createObjectURL(blob);el('feed').src=next;el('feed').hidden=false;if(url)URL.revokeObjectURL(url);url=next;el('status').textContent='● In diretta'}catch(e){el('feed').hidden=true;el('status').textContent=e.message==='401'?'Link scaduto':'Segnale assente · riconnessione…';wait=1500}setTimeout(poll,wait)}
async function state(){try{const s=await(await api('/light')).json();if(!editing&&!busy){available=s.available;level=s.level;if(level)lastLevel=level;render()}}catch{available=false;render()}setTimeout(state,2200)}
if(demo){available=true;el('drawing').hidden=false;el('status').textContent='◉ Demo interattiva';el('source').textContent='Simulazione della stampa';render();setInterval(draw,100)}else if(key){poll();state()}else el('status').textContent='Apri il link condiviso dalla postazione';
</script></html>
